buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.77'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = mod_version
group = mod_group
archivesBaseName = "AdvancedInscriber-${minecraft_version}"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
}

minecraft {
    mappings channel: mcp_channel, version: mcp_mappings

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.disableRefMap', 'true'
            mods {
                advancedinscriber {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.disableRefMap', 'true'
            mods {
                advancedinscriber {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.disableRefMap', 'true'
            forceExit false
            args '--mod', mod_id, '--all', '--output', file('build/generated-test-resources'),
                    '--existing', file('src/main/resources')
            mods {
                advancedinscriber {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'appeng'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("appeng:appliedenergistics2:${ae2_version}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraft_version
    inputs.property 'forge_version', forge_version
    inputs.property 'ae2_version', ae2_version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version,
                minecraft_version: minecraft_version,
                forge_version: forge_version,
                ae2_version: ae2_version
    }
}

jar {
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE.txt' }
    }
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
    }
    from('THIRD_PARTY_LICENSES/AE2THINGS-MIT.txt') {
        into 'META-INF/THIRD_PARTY_LICENSES'
    }

    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : 'Advanced Inscriber Backport contributors',
                'Specification-Version'   : project.version,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'Advanced Inscriber Backport contributors',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}
